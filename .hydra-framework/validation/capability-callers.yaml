      .hydra-framework/engine/src/hydra_engine/commands/agent_hooks.py:
        - def command_hook_token_pre_context
        - pre_context.set_defaults(func=_dispatch_hook_token_pre_context)
    callers:
      .hydra-framework/validation/README.md:
        - Use `hydra.py hook-token pre-context --budget <tokens>`

