schema: hydra-framework.package-routing.v2
package: <package-slug>
title: <Package Name>
state: .hydra-framework/repo/knowledge/knowledge-packages/<package-slug>/state.md
keywords: <keyword>, <phrase>, <domain term>
note: Read the route, not the tree.

# One entry per durable task shape. Delete this worked example and replace it
# with your own routes; a package with zero routes is still legal (its units,
# if any, just are not scoped down by task) -- see `repo/knowledge/knowledge-packages.md`.
routes:
  example_route:
    use_when:
      - <task shape or question this route answers>
    priority_units:
      - hydra://knowledge-unit/<package-slug>/<unit-slug>
    requires:
      - hydra://knowledge-unit/<package-slug>/<must-read-unit-slug>
    expand_when:
      - when_paths:
          - <glob of paths that, when touched, mean read more>
        read:
          - hydra://knowledge-unit/<package-slug>/<conditionally-relevant-unit-slug>
        why: <one line: why this path pattern implies that unit>
    avoid_by_default:
      - <large generated folders, private notes, or source material not needed for this route>
    verify:
      - <command that checks work done under this route>
