name: Hydra

# Enforces the framework's own invariants. Without this, adapter drift and
# contract drift are only detectable by someone remembering to check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  framework:
    name: Framework checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependencies to install: hydra.py is deliberately stdlib-only.
      - name: Selftest
        run: python3 .hydra-framework/scripts/hydra.py selftest

      - name: Doctor
        run: python3 .hydra-framework/scripts/hydra.py doctor

      - name: Adapter drift
        run: python3 .hydra-framework/scripts/hydra.py export-adapters --check

      # `doctor` already fails on this through validate_tier_boundaries. This
      # step repeats it directly so a violation names itself, and so the check
      # does not depend on the validator's own correctness.
      - name: Private state is not tracked
        run: |
          tracked=$(git ls-files -- '.hydra-framework.local' | grep -v '^\.hydra-framework\.local\.example/' || true)
          if [ -n "$tracked" ]; then
            echo "Private-tier files are tracked in Git:"
            echo "$tracked"
            echo ""
            echo ".hydra-framework.local/ must stay ignored."
            exit 1
          fi

      - name: Unmanaged provider surfaces
        run: python3 .hydra-framework/scripts/hydra.py reclaim --fail-on-findings

      - name: Knowledge package gates
        run: python3 .hydra-framework/scripts/hydra.py validate-package-docs

      - name: Wiki links
        run: python3 .hydra-framework/scripts/hydra.py validate-wiki

      # Reported, not enforced: this repository has no agreed budget yet.
      # Add --fail-over <tokens> once the team picks one from a measured baseline.
      - name: Context surface size
        run: python3 .hydra-framework/scripts/hydra.py measure-context
